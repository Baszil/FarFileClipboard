name: build

on:
  push:
  pull_request:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/FarFileClipboard package/FarFileClipboard -Recurse
          Copy-Item install.cmd,README.md,README.ru.md package/
          Compress-Archive -Path package/* -DestinationPath FarFileClipboard-1.0.0-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FarFileClipboard-1.0.0-x64
          path: FarFileClipboard-1.0.0-x64.zip
