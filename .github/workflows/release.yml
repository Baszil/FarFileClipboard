name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/FarFileClipboard package/FarFileClipboard -Recurse
          Copy-Item install.cmd,install.ps1,README.md,README.ru.md package/
          Compress-Archive -Path package/* -DestinationPath FarFileClipboard-1.0.0-x64.zip

      - name: Package source
        shell: pwsh
        run: |
          git archive --format=zip --output FarFileClipboard-1.0.0-source.zip HEAD

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FarFileClipboard-1.0.0-x64.zip
            FarFileClipboard-1.0.0-source.zip
          generate_release_notes: true
