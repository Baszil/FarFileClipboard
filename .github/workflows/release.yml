name: release

on:
  push:
    tags:
      - "v1.0.0"

permissions:
  contents: write

jobs:
  binaries:
    name: Build ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cmake_arch: Win32
          - arch: x64
            cmake_arch: x64
          - arch: ARM64
            cmake_arch: ARM64

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-${{ matrix.arch }} -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }}

      - name: Build
        run: cmake --build build-${{ matrix.arch }} --config Release

      - name: Verify PE architecture
        shell: pwsh
        run: ./tools/verify-pe.ps1 -Path "dist/FarFileClipboard-${{ matrix.arch }}/FarFileClipboard.dll" -Expected "${{ matrix.arch }}"

      - name: Package binary
        shell: pwsh
        run: |
          $stage = "package-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "dist/FarFileClipboard-${{ matrix.arch }}" "$stage/FarFileClipboard" -Recurse
          Copy-Item install.cmd,install.ps1,README.md,README.ru.md $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "FarFileClipboard-1.0.0-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: FarFileClipboard-1.0.0-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Package source
        run: git archive --format=zip --output FarFileClipboard-1.0.0-source.zip HEAD

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/FarFileClipboard-1.0.0-x86.zip
            release-assets/FarFileClipboard-1.0.0-x64.zip
            release-assets/FarFileClipboard-1.0.0-ARM64.zip
            FarFileClipboard-1.0.0-source.zip
          generate_release_notes: true
