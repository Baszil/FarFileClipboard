name: x86 functional test

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  functional:
    runs-on: windows-2022
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - name: Configure x86
        run: cmake -S . -B build-x86 -G "Visual Studio 17 2022" -A Win32

      - name: Build x86
        run: cmake --build build-x86 --config Release

      - name: Verify PE architecture
        shell: pwsh
        run: ./tools/verify-pe.ps1 -Path "dist/FarFileClipboard-x86/FarFileClipboard.dll" -Expected "x86"

      - name: Verify exact Far API exports
        shell: pwsh
        run: |
          $dll = (Resolve-Path "dist/FarFileClipboard-x86/FarFileClipboard.dll").Path
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vs) { throw "Visual Studio with VC tools not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars32.bat"
          $exports = cmd /c "`"$vcvars`" >nul && dumpbin /nologo /exports `"$dll`""
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }

          $required = @(
            "GetGlobalInfoW",
            "SetStartupInfoW",
            "GetPluginInfoW",
            "OpenW",
            "ConfigureW",
            "ProcessConsoleInputW",
            "ProcessSynchroEventW"
          )
          foreach ($name in $required) {
            if (-not ($exports -match "\s$name\s*$")) {
              $exports | Write-Host
              throw "Missing undecorated x86 Far API export: $name"
            }
          }

      - name: Download Far x86
        shell: pwsh
        run: |
          Invoke-WebRequest `
            "https://www.farmanager.com/files/Far30b6699.x86.20260614.7z" `
            -OutFile "far.7z"
          7z x far.7z -ofar

      - name: Install plugin and prepare functional test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "far\Plugins\FarFileClipboard" | Out-Null
          Copy-Item "dist\FarFileClipboard-x86\*" "far\Plugins\FarFileClipboard\" -Recurse -Force

          Remove-Item "test-src" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "test-dst" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "far-profile" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "markers" -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path "test-src" | Out-Null
          New-Item -ItemType Directory -Force -Path "test-dst" | Out-Null
          New-Item -ItemType Directory -Force -Path "markers" | Out-Null
          Set-Content -Path "test-src\x86-test.txt" -Value "FarFileClipboard x86 functional test"

          $profile = Join-Path $PWD "far-profile"
          $macroDir = Join-Path $profile "Macros\scripts"
          New-Item -ItemType Directory -Force -Path $macroDir | Out-Null

          @'
          local function markerPath(name)
            local root = win.GetEnv("GITHUB_WORKSPACE")
            return root .. "\\markers\\" .. name
          end

          local function mark(name, value)
            local f = io.open(markerPath(name), "w")
            if f then
              f:write(value or "OK")
              f:close()
            end
          end

          local function normalizeGuid(value)
            if value == nil then
              return ""
            end
            return tostring(value):upper():gsub("[{}]", "")
          end

          local function fail(name, value)
            mark(name, value)
            actl.Quit(20)
          end

          Macro {
            area="Shell";
            flags="RunAfterFARStart";
            description="FarFileClipboard x86 functional test";

            action=function()
              local pluginName = "FarFileClipboard"
              local pluginGuid = "6FE2C62E-43E8-45CB-A79A-4FE48547B291"
              local operationsMenuGuid = "853C895D-C2EC-4931-9BF5-300E55C58418"

              local root = win.GetEnv("GITHUB_WORKSPACE")
              local src = root .. "\\test-src"
              local dst = root .. "\\test-dst"
              local file = "x86-test.txt"
              local result = dst .. "\\" .. file

              mark("01-macro-started.txt")

              if not Plugin.Exist(pluginGuid) then
                fail("90-plugin-not-found.txt")
                return
              end
              mark("02-plugin-found.txt")

              if not Panel.SetPath(0, src, file) then
                fail("91-source-open-failed.txt")
                return
              end
              mark("03-source-opened.txt")
              mark("04-source-current.txt", tostring(APanel.Current))

              if APanel.Current ~= file then
                fail("92-wrong-source-item.txt", "Expected: " .. file .. "\nActual: " .. tostring(APanel.Current))
                return
              end
              mark("05-source-file-confirmed.txt")

              Keys("F11")
              if not Area.Menu then
                fail("93-f11-copy-menu-not-open.txt")
                return
              end
              mark("06-f11-copy-menu-open.txt")

              local copyPluginPos = Menu.Select(pluginName, 0)
              mark("07-copy-plugin-position.txt", tostring(copyPluginPos))
              if not copyPluginPos or copyPluginPos <= 0 then
                fail("94-copy-plugin-not-in-f11.txt")
                return
              end

              Keys("Enter")
              if not Area.Menu then
                fail("95-copy-operations-menu-not-open.txt")
                return
              end

              local copyMenuId = normalizeGuid(Menu.Id)
              mark("08-copy-operations-menu-id.txt", copyMenuId)
              if copyMenuId ~= operationsMenuGuid then
                fail("96-copy-wrong-operations-menu.txt", "Expected: " .. operationsMenuGuid .. "\nActual: " .. copyMenuId)
                return
              end
              mark("09-copy-operations-menu-confirmed.txt")

              Keys("Home Enter")
              mark("10-copy-selected.txt")
              mf.sleep(500)

              if not Panel.SetPath(0, dst) then
                fail("97-destination-open-failed.txt")
                return
              end
              mark("11-destination-opened.txt")

              Keys("F11")
              if not Area.Menu then
                fail("98-f11-paste-menu-not-open.txt")
                return
              end
              mark("12-f11-paste-menu-open.txt")

              local pastePluginPos = Menu.Select(pluginName, 0)
              mark("13-paste-plugin-position.txt", tostring(pastePluginPos))
              if not pastePluginPos or pastePluginPos <= 0 then
                fail("99-paste-plugin-not-in-f11.txt")
                return
              end

              Keys("Enter")
              if not Area.Menu then
                fail("100-paste-operations-menu-not-open.txt")
                return
              end

              local pasteMenuId = normalizeGuid(Menu.Id)
              mark("14-paste-operations-menu-id.txt", pasteMenuId)
              if pasteMenuId ~= operationsMenuGuid then
                fail("101-paste-wrong-operations-menu.txt", "Expected: " .. operationsMenuGuid .. "\nActual: " .. pasteMenuId)
                return
              end
              mark("15-paste-operations-menu-confirmed.txt")

              Keys("Home Down Down Enter")
              mark("16-paste-selected.txt")
              mf.sleep(1500)

              if win.GetFileAttr(result) then
                mark("17-file-created.txt")
                actl.Quit(0)
              else
                fail("102-file-not-created.txt")
              end
            end;
          }
          '@ | Set-Content -Path (Join-Path $macroDir "x86-functional.lua") -Encoding UTF8

      - name: Run x86 Far functional test
        shell: pwsh
        run: |
          $profile = (Resolve-Path "far-profile").Path
          $pluginPath = (Resolve-Path "far\Plugins").Path
          $p = Start-Process `
            ".\far\Far.exe" `
            -ArgumentList @("/s", $profile, "/p$pluginPath") `
            -WorkingDirectory $PWD `
            -PassThru

          $deadline = (Get-Date).AddSeconds(30)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
          }

          if (-not $p.HasExited) {
            Stop-Process -Id $p.Id -Force
            throw "x86 Far functional test timed out"
          }
          if ($p.ExitCode -ne 0) {
            throw "x86 Far functional test failed with exit code $($p.ExitCode)"
          }

      - name: Show diagnostic markers
        if: always()
        shell: pwsh
        run: |
          Write-Host "===== x86 FUNCTIONAL TEST MARKERS ====="
          $markers = Get-ChildItem "markers" -File -ErrorAction SilentlyContinue | Sort-Object Name
          if (!$markers) {
            Write-Host "NO MARKERS CREATED"
          }
          else {
            foreach ($marker in $markers) {
              Write-Host ""
              Write-Host "[$($marker.Name)]"
              Get-Content $marker.FullName
            }
          }
          Write-Host "======================================="

      - name: Verify x86 functional result
        shell: pwsh
        run: |
          $required = @(
            "01-macro-started.txt",
            "02-plugin-found.txt",
            "03-source-opened.txt",
            "04-source-current.txt",
            "05-source-file-confirmed.txt",
            "06-f11-copy-menu-open.txt",
            "07-copy-plugin-position.txt",
            "08-copy-operations-menu-id.txt",
            "09-copy-operations-menu-confirmed.txt",
            "10-copy-selected.txt",
            "11-destination-opened.txt",
            "12-f11-paste-menu-open.txt",
            "13-paste-plugin-position.txt",
            "14-paste-operations-menu-id.txt",
            "15-paste-operations-menu-confirmed.txt",
            "16-paste-selected.txt",
            "17-file-created.txt"
          )

          foreach ($name in $required) {
            if (!(Test-Path (Join-Path "markers" $name))) {
              throw "x86 functional test stopped before marker: $name"
            }
          }

          $content = Get-Content "test-dst\x86-test.txt" -Raw
          if ($content -notmatch "FarFileClipboard x86 functional test") {
            throw "x86 copied file content mismatch"
          }

          Write-Host "x86 Far loaded FarFileClipboard and completed Copy/Paste through the plugin menu."
